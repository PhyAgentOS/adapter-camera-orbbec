name: Build Ubuntu 20.04 binary
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Existing annotated vX.Y.Z tag from the selected Forge line
        required: true
        type: string
      version:
        description: Exact node version in the tag and source manifest (not the Forge line)
        required: true
        type: string
      release_line:
        description: Forge compatibility line
        required: true
        type: choice
        options:
        - 1.x
        - 2.x
        default: 2.x
  workflow_call:
    inputs:
      ref:
        description: Existing annotated vX.Y.Z tag from the selected Forge line
        required: true
        type: string
      version:
        description: Exact node version in the tag and source manifest (not the Forge line)
        required: true
        type: string
      release_line:
        description: Forge compatibility line
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      BUILD_REF: ${{ inputs.ref }}
      RELEASE_TAG: ${{ inputs.ref }}
      RELEASE_LINE: ${{ inputs.release_line }}
    steps:
    - name: Install system tools
      run: |
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y \
          binutils \
          build-essential \
          ca-certificates \
          cmake \
          curl \
          file \
          git \
          libgl1 \
          libglib2.0-0 \
          libusb-1.0-0 \
          libwayland-client0 \
          libx11-6 \
          libxcursor1 \
          libxext6 \
          libxinerama1 \
          libxi6 \
          libxkbcommon0 \
          libxrandr2 \
          libxss1 \
          libxxf86vm1 \
          linux-libc-dev \
          pkg-config
        rm -rf /var/lib/apt/lists/*
    - uses: actions/checkout@v6
      with:
        ref: refs/tags/${{ inputs.ref }}
        fetch-depth: 0
        persist-credentials: false
    - name: Check out release tooling from the workflow commit
      uses: actions/checkout@v6
      with:
        ref: ${{ github.workflow_sha }}
        path: .release-tools
        persist-credentials: false
    - name: Verify tag ancestry
      run: |
        checked_out="$(git -c safe.directory="${GITHUB_WORKSPACE}" rev-parse HEAD)"
        tagged="$(git -c safe.directory="${GITHUB_WORKSPACE}" rev-parse "refs/tags/${BUILD_REF}^{commit}")"
        test "${checked_out}" = "${tagged}"
        git -c safe.directory="${GITHUB_WORKSPACE}" merge-base --is-ancestor "${tagged}" "${GITHUB_SHA}"
    - name: Install uv and Python 3.12
      run: |
        curl -LsSf https://astral.sh/uv/0.12.5/install.sh |
          env UV_INSTALL_DIR=/usr/local/bin sh
        uv python install 3.12
        uv --version
        uv run --no-project --python 3.12 python --version
    - name: Validate Forge release line and source version
      run: |
        git config --global --add safe.directory "$(pwd -P)"
        uv run --no-project --python 3.12 python .release-tools/scripts/check_release_line.py --line "$RELEASE_LINE" --tag "$RELEASE_TAG" --version "$RELEASE_VERSION" --default-branch master
    - name: Build with PyInstaller
      run: ./scripts/build_pyinstaller.sh
    - name: Verify and package binary
      run: |
        test "${BUILD_REF}" = "v${RELEASE_VERSION}"
        ./dist/orbbec_camera --version | tee /tmp/version.txt
        grep -Fx "orbbec-camera ${RELEASE_VERSION}" /tmp/version.txt
        file ./dist/orbbec_camera
        ldd --version | sed -n '1p'
        archive="orbbec_camera-v${RELEASE_VERSION}-ubuntu20.04-x86_64.tar.gz"
        tar \
          --sort=name \
          --mtime='UTC 1970-01-01' \
          --owner=0 \
          --group=0 \
          --numeric-owner \
          -C dist \
          -czf "${archive}" \
          orbbec_camera
        sha256sum "${archive}" > "${archive}.sha256"
        test "$(tar -tzf "${archive}")" = "orbbec_camera"
        sha256sum --check "${archive}.sha256"
    - uses: actions/upload-artifact@v6
      with:
        name: orbbec_camera-v${{ inputs.version }}-ubuntu20.04-x86_64
        path: |
          orbbec_camera-v${{ inputs.version }}-ubuntu20.04-x86_64.tar.gz
          orbbec_camera-v${{ inputs.version }}-ubuntu20.04-x86_64.tar.gz.sha256
        if-no-files-found: error
        retention-days: 30
